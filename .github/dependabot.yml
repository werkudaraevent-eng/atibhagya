# Dependency updates as pull requests against staging, once a week, with
# minor and patch bumps grouped so there is one PR to review rather than
# thirty. Security advisories still arrive on their own, straight away.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions are a deliberate move, made with the changelog open,
      # not a Monday-morning merge — TypeScript 7, Next 17, Payload 4 and
      # the like. Security advisories still arrive regardless of this.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
