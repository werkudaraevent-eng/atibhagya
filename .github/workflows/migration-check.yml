# A reminder, not a gate: if a pull request touches the CMS schema files
# without adding a migration, say so on the PR. Not every edit to a
# collection changes the schema (labels, descriptions, hooks), so this
# never blocks — it makes the question impossible to forget.
name: Migration check

on:
  pull_request:
    paths:
      - 'src/collections/**'
      - 'src/globals/**'
      - 'src/payload.config.ts'

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for a new migration in this PR
        id: look
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          added=$(git diff --name-only --diff-filter=A "$base" "$head" -- 'src/migrations/*.ts' | grep -v index.ts || true)
          if [ -n "$added" ]; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "Migrations added:"; echo "$added"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "No migration added."
          fi

      - name: Comment when none was added
        if: steps.look.outputs.found == 'no'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- migration-check -->'
            const body = [
              marker,
              '**Schema files changed, no migration added.**',
              '',
              'This PR touches `src/collections`, `src/globals` or `payload.config.ts` but adds no file under `src/migrations`.',
              'If a field was added, renamed or retyped, staging and production will break without one:',
              '',
              '```',
              'npm run migrate:create:staging -- <short_name>',
              '```',
              '',
              'Commit the generated `src/migrations/*_<short_name>.ts` (and `.json`, and `index.ts`) into this PR.',
              'If the change is only labels, descriptions, hooks or access rules, no migration is needed — ignore this.',
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number })
            const mine = comments.data.find((c) => c.body && c.body.includes(marker))
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
