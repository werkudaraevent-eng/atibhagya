# Every pull request and every push to staging or main: types, lint, and a
# real build against a throwaway SQLite file. Vercel builds too, but this
# one runs first and blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # No database on purpose. Without DATABASE_URI the content layer
          # renders the built-in default content, which is all a build check
          # needs. (An empty SQLite file would have no tables: a production
          # build never pushes a schema, so every query would fail.)
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # Advisories are reported, not blocking: a transitive "high" with no fix
  # yet should not stop a copy change from shipping. Read it, then decide.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
