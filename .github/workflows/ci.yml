# Every pull request and every push to staging or main: types, lint, and a
# real build against a throwaway SQLite file. Vercel builds too, but this
# one runs first and blocks the merge.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # No database on purpose. Without DATABASE_URI the content layer
          # renders the built-in default content, which is all a build check
          # needs. (An empty SQLite file would have no tables: a production
          # build never pushes a schema, so every query would fail.)
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # Critical advisories in what ships to production block the merge: that is
  # how Next 16.3.4 and Payload 3.89 (RCE, access-control bypass) sat on main
  # unnoticed while this job only reported. Highs and dev-only advisories are
  # still printed for a person to read, without stopping a copy change.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block on critical advisories (production dependencies)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report high and dev-only advisories
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high
